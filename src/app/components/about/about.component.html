<section id="sobre" class="relative min-h-screen flex items-center overflow-hidden">

  <!-- Background Effects -->
  <div class="absolute inset-0 pointer-events-none">
    <div class="about-orb about-orb-left animate-float"></div>
    <div class="about-orb about-orb-right animate-float" style="animation-delay: 3s;"></div>
    <div class="about-grid-pattern"></div>
  </div>

  <div class="section-container relative z-10 w-full">
    <div class="flex flex-col lg:flex-row items-center gap-12 lg:gap-16">

      <!-- Profile Photo -->
      <div class="flex-shrink-0 animate-fade-in">
        <div class="relative group">
          <!-- Glow ring -->
          <div class="profile-glow animate-pulse-glow"></div>
          <!-- Photo container -->
          <div class="profile-photo-container">
            <img
              src="assets/minha-foto.png"
              alt="Foto de perfil de Jair Victor"
              class="w-full h-full object-cover object-center"
              loading="eager"
            />
          </div>
          <!-- Status indicator -->
          <div class="profile-status"></div>
        </div>
      </div>

      <!-- Text Content -->
      <div class="text-center lg:text-left flex-1">

        <!-- Name -->
        <h1 class="text-4xl md:text-5xl lg:text-6xl font-bold text-white mb-4 animate-slide-up animate-delay-100">
          Jair Victor
          <span class="block gradient-text mt-1">Desenvolvedor de Software</span>
        </h1>

        <!-- Summary -->
        <p class="text-surface-400 text-lg md:text-xl leading-relaxed max-w-2xl mb-8 animate-slide-up animate-delay-200">
          {{ summary }}
        </p>

        <!-- Highlights Pills -->
        <div class="flex flex-wrap justify-center lg:justify-start gap-3 mb-10 animate-slide-up animate-delay-300">
          @for (item of highlights; track item.label) {
            <div class="highlight-pill">
              <span>{{ item.icon }}</span>
              <span>{{ item.label }}</span>
            </div>
          }
        </div>

        <!-- CTA Buttons -->
        <div class="flex flex-wrap justify-center lg:justify-start gap-4 animate-slide-up animate-delay-400">
          <a href="#contato" class="cta-primary">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
              <polyline points="22,6 12,13 2,6"></polyline>
            </svg>
            Entre em Contato
          </a>
          <a href="https://github.com/JairAssisDev" target="_blank" rel="noopener noreferrer" class="cta-secondary">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/>
            </svg>
            Ver GitHub
          </a>
        </div>
      </div>
    </div>

    <!-- Scroll Indicator -->
    <div class="absolute bottom-8 left-1/2 -translate-x-1/2 flex flex-col items-center gap-2 animate-fade-in animate-delay-500">
      <span class="text-surface-500 text-xs font-medium tracking-widest uppercase">Scroll</span>
      <div class="w-5 h-8 rounded-full border-2 border-surface-600 flex justify-center pt-1.5">
        <div class="w-1 h-2 bg-surface-500 rounded-full animate-bounce"></div>
      </div>
    </div>
  </div>
</section>
