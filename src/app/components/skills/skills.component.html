<section id="habilidades" class="relative">
  <!-- Section divider -->
  <div class="section-divider-line"></div>

  <!-- Background Effects -->
  <div class="absolute inset-0 pointer-events-none">
    <div class="skills-bg-orb"></div>
  </div>

  <div class="section-container relative z-10">
    <!-- Section Header -->
    <div class="text-center mb-16">
      <span class="inline-block text-brand-400 font-mono text-sm font-semibold tracking-wider uppercase mb-3">Tech Stack</span>
      <h2 class="section-title">Habilidades <span class="gradient-text">Técnicas</span></h2>
      <p class="section-subtitle mt-3">Tecnologias e ferramentas do meu arsenal</p>
    </div>

    <!-- Skills Grid -->
    <div class="grid sm:grid-cols-2 lg:grid-cols-4 gap-6 max-w-5xl mx-auto">
      @for (category of categories; track category.title) {
        <div class="glass-card p-6 skill-card group">
          <!-- Category Header -->
          <div class="flex items-center gap-3 mb-5">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-br flex items-center justify-center text-lg shadow-lg"
                 [class]="category.gradient">
              {{ category.icon }}
            </div>
            <h3 class="text-base font-bold text-white leading-tight">{{ category.title }}</h3>
          </div>

          <!-- Skills List -->
          <div class="flex flex-wrap gap-2">
            @for (skill of category.skills; track skill) {
              <span class="badge text-xs">{{ skill }}</span>
            }
          </div>
        </div>
      }
    </div>
  </div>
</section>
