<section id="contato" class="relative">
  <!-- Section divider -->
  <div class="section-divider-line"></div>

  <div class="section-container">
    <!-- Section Header -->
    <div class="text-center mb-16">
      <span class="inline-block text-brand-400 font-mono text-sm font-semibold tracking-wider uppercase mb-3">Contato</span>
      <h2 class="section-title">Vamos <span class="gradient-text">Conversar?</span></h2>
      <p class="section-subtitle mt-3">Estou disponível para novos projetos e oportunidades</p>
    </div>

    <!-- Contact Content -->
    <div class="max-w-xl mx-auto">
      <!-- Contact Cards -->
      <div class="grid sm:grid-cols-2 gap-4 mb-8">
        <!-- Email Card -->
        <a href="mailto:{{ email }}"
           class="glass-card px-5 py-4 flex items-center justify-center gap-3.5 contact-card group">
          <div class="contact-icon-email flex-shrink-0">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                 stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
              <polyline points="22,6 12,13 2,6"></polyline>
            </svg>
          </div>
          <div>
            <span class="text-[11px] font-semibold text-surface-500 uppercase tracking-wider block">E-mail</span>
            <p class="text-white font-medium text-sm group-hover:text-brand-300 transition-colors duration-300">{{ email }}</p>
          </div>
        </a>

        <!-- Location Card -->
        <div class="glass-card px-5 py-4 flex items-center justify-center gap-3.5 contact-card">
          <div class="contact-icon-location flex-shrink-0">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                 stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
              <circle cx="12" cy="10" r="3"></circle>
            </svg>
          </div>
          <div>
            <span class="text-[11px] font-semibold text-surface-500 uppercase tracking-wider block">Localização</span>
            <p class="text-white font-medium text-sm">{{ location }}</p>
          </div>
        </div>
      </div>

      <!-- CTA -->
      <div class="text-center">
        <a href="mailto:{{ email }}" class="cta-send-email">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
          Enviar E-mail
        </a>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="footer-container">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
      <div class="flex flex-col md:flex-row items-center justify-between gap-6">
        <!-- Logo -->
        <div class="flex items-center gap-2">
          <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-brand-500 to-cyan-400 flex items-center justify-center shadow-lg">
            <span class="text-white font-bold text-xs">JV</span>
          </div>
          <span class="text-surface-400 text-sm">
            © {{ currentYear }} <span class="text-white font-medium">Jair Victor</span>. Todos os direitos reservados.
          </span>
        </div>

        <!-- Social Links -->
        <div class="flex items-center gap-3">
          <a href="https://github.com/JairAssisDev" target="_blank" rel="noopener noreferrer"
             aria-label="GitHub" class="footer-social-btn">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/>
            </svg>
          </a>
          <a href="https://linkedin.com/in/jair-victor" target="_blank" rel="noopener noreferrer"
             aria-label="LinkedIn" class="footer-social-btn">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
              <path d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z"/>
            </svg>
          </a>
        </div>
      </div>
    </div>
  </footer>
</section>
